#.streamlit/config.toml
[theme]
primaryColor = "#2D5BFF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#121A2B"
textColor = "#E6EDF3"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 500

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
