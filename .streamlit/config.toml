#.streamlit/config.toml
[theme]
primaryColor = "#0052CC"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B4D"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 500
fileWatcherType = "none"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
