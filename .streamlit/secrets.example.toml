# انسخ الملف إلى .streamlit/secrets.toml محليًا فقط ولا ترفعه إلى Git.

DATABASE_URL = "postgresql://USER:PASSWORD@HOST:PORT/DBNAME"
AUTH_SECRET = "ضع_سراً_عشوائياً_بطول_32_حرفاً_على_الأقل"
TWELVEDATA_API_KEY = "YOUR_API_KEY"

# خيارات التشغيل. في Streamlit Community Cloud يمكن وضعها أيضًا في Secrets.
OSOUL_MIN_PASSWORD_LEN = "10"
OSOUL_SESSION_IDLE_MINUTES = "120"
OSOUL_MAX_LOGIN_ATTEMPTS = "5"
OSOUL_LOGIN_LOCK_SECONDS = "900"
OSOUL_REQUIRE_DB = "1"
OSOUL_ALLOW_SQLITE_FALLBACK = "0"
