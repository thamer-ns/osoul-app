name: Apply AUTH_SECRET runtime fallback

on:
  push:
    branches:
      - agent/auth-secret-runtime-fallback

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth-secret-runtime-fallback
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply secure runtime secret fallback
        run: python scripts/apply_auth_secret_fix.py

      - name: Validate syntax
        run: python -m compileall -q security.py tests/test_auth_secret_runtime.py

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security.py tests/test_auth_secret_runtime.py
          git commit -m "Fix missing AUTH_SECRET with secure runtime fallback"
          git push origin HEAD:agent/auth-secret-runtime-fallback
