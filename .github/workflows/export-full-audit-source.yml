name: Diagnose reviewed audit archive

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose-archive:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-ui-performance-audit
          fetch-depth: 0

      - name: Build archive diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "PART HASHES"
            sha256sum .audit_patch/part*
            echo
            echo "PART SIZES"
            wc -c .audit_patch/part*
            echo
            cat .audit_patch/part* | base64 --decode > /tmp/osoul_patch.tar.gz
            echo "BASE64_RC=$?"
            echo "ARCHIVE_HASH"
            sha256sum /tmp/osoul_patch.tar.gz
            echo "ARCHIVE_SIZE=$(wc -c < /tmp/osoul_patch.tar.gz)"
            gzip -t /tmp/osoul_patch.tar.gz
            echo "GZIP_RC=$?"
            tar -tzf /tmp/osoul_patch.tar.gz
            echo "TAR_RC=$?"
          } > PATCH_DIAGNOSTICS.txt 2>&1
          exit 0

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PATCH_DIAGNOSTICS.txt
          git commit -m "Record audit archive diagnostics"
          git push origin HEAD:agent/full-ui-performance-audit
