name: Export full audit source

on:
  push:
    branches:
      - agent/full-ui-performance-audit

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-ui-performance-audit
          fetch-depth: 1

      - name: Build review archive
        run: |
          tar \
            --exclude=.git \
            --exclude='**/__pycache__' \
            --exclude='*.pyc' \
            -czf /tmp/osoul-audit-source.tar.gz .

      - name: Upload review archive
        uses: actions/upload-artifact@v4
        with:
          name: osoul-audit-source
          path: /tmp/osoul-audit-source.tar.gz
          retention-days: 1
          if-no-files-found: error
