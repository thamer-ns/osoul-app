name: Apply reviewed full audit patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-ui-performance-audit
          fetch-depth: 0

      - name: Confirm patch readiness
        run: test -f PATCH_READY

      - name: Rebuild and validate patch archive
        run: |
          cat .audit_patch/part* | base64 --decode > /tmp/osoul_patch.tar.gz
          sha256sum /tmp/osoul_patch.tar.gz
          tar -tzf /tmp/osoul_patch.tar.gz > /tmp/osoul_patch_files.txt
          test -s /tmp/osoul_patch_files.txt
          test "$(wc -l < /tmp/osoul_patch_files.txt)" -ge 20
          grep -qx 'app.py' /tmp/osoul_patch_files.txt
          grep -qx 'styles.py' /tmp/osoul_patch_files.txt
          grep -qx 'views/dashboard.py' /tmp/osoul_patch_files.txt
          grep -qx 'views/analysis/technical.py' /tmp/osoul_patch_files.txt
          grep -qx 'financial_analysis/metrics.py' /tmp/osoul_patch_files.txt
          grep -qx 'tests/test_ui_theme_v2.py' /tmp/osoul_patch_files.txt
          grep -qx 'tests/test_fundamental_metrics.py' /tmp/osoul_patch_files.txt

      - name: Apply reviewed source files
        run: |
          tar -xzf /tmp/osoul_patch.tar.gz
          rm -rf .audit_patch PATCH_READY AUDIT_IN_PROGRESS.md docs/audit_scope.md
          rm -f .github/workflows/export-full-audit-source.yml
          rm -f .github/workflows/apply-full-audit-patch.yml

      - name: Validate syntax and repository audit
        run: |
          python -m compileall -q .
          python tools/repository_audit.py --root .

      - name: Commit reviewed patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete UI, performance and analytics hardening"
          git push origin HEAD:agent/full-ui-performance-audit
