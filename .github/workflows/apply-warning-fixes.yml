name: Apply full audit warning fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-warning-fixes:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/osoul-production-hardening-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply reviewed warning fixes
        id: apply
        continue-on-error: true
        run: python scripts/apply_warning_patch.py > warning-fix.log 2>&1

      - name: Upload warning fixer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warning-fix-diagnostics
          path: warning-fix.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop on warning fixer failure
        if: ${{ steps.apply.outcome == 'failure' }}
        run: |
          cat warning-fix.log
          exit 1

      - name: Commit warning fixes
        run: |
          if git diff --quiet; then
            echo "No warning fixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Resolve repository-wide audit warnings"
          git push origin HEAD:agent/osoul-production-hardening-v2
