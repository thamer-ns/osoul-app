name: Apply full audit warning fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-warning-fixes:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/osoul-production-hardening-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply reviewed warning fixes
        run: python scripts/apply_warning_fixes.py

      - name: Commit warning fixes
        run: |
          if git diff --quiet; then
            echo "No warning fixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Resolve repository-wide audit warnings"
          git push origin HEAD:agent/osoul-production-hardening-v2
