name: Osoli quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax and project self-check
        run: python tools/self_check.py

      - name: Critical Ruff checks
        run: >-
          ruff check
          --select E9,F63,F7,F82
          app.py security.py tenant_scope.py analytics_hardening.py
          market_data_hardening.py technical_indicators ai_engine_core/packs.py
          views/portfolio.py views/dashboard.py views/analysis/technical.py tests

      - name: Test corrected XIRR
        run: pytest -q --tb=short tests/test_analytics_hardening.py

      - name: Test advanced technical contract
        run: pytest -q --tb=short tests/test_advanced_v2.py

      - name: Test tenant SQL isolation
        env:
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: pytest -q --tb=short tests/test_tenant_scope_sql.py

      - name: Run complete test suite
        env:
          OSOUL_ALLOW_EPHEMERAL_AUTH_SECRET: "1"
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: pytest -q --tb=short

  secret-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan complete Git history for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
