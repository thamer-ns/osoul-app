name: Osoli quality gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: osoli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax and project self-check
        run: python tools/self_check.py

      - name: Critical Ruff checks
        run: >-
          ruff check
          --select E9,F63,F7,F82
          app.py security.py database_security_hardening.py tenant_scope.py
          ai_tenant_hardening.py analytics_hardening.py market_data_hardening.py
          technical_indicators ai_engine_core/packs.py views/portfolio.py
          views/dashboard.py views/cash.py views/sukuk.py
          views/analysis/technical.py views/__init__.py tests

      - name: Test XIRR cashflow construction
        run: >-
          pytest -q --tb=short
          tests/test_analytics_hardening.py::test_internal_return_is_not_external_cashflow

      - name: Test XIRR solver method
        run: >-
          pytest -q --tb=short
          tests/test_analytics_hardening.py::test_xirr_uses_stable_bisection_method

      - name: Test XIRR numeric result
        run: >-
          pytest -q --tb=short
          tests/test_analytics_hardening.py::test_xirr_numeric_rate_is_about_ten_percent

      - name: Test XIRR edge conditions
        run: >-
          pytest -q --tb=short
          tests/test_analytics_hardening.py::test_xirr_requires_positive_and_negative_external_flows

      - name: Test advanced technical contract
        run: pytest -q --tb=short tests/test_advanced_v2.py

      - name: Test tenant SQL isolation
        env:
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: pytest -q --tb=short tests/test_tenant_scope_sql.py

      - name: Import smoke test
        env:
          OSOUL_ALLOW_EPHEMERAL_AUTH_SECRET: "1"
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: >-
          python -c "import app, security, tenant_scope, analytics_hardening,
          market_data_hardening, technical_indicators.advanced_v2,
          views.portfolio, views.dashboard, views.cash, views.sukuk"

      - name: Run complete test suite
        env:
          OSOUL_ALLOW_EPHEMERAL_AUTH_SECRET: "1"
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: pytest -q --tb=short

  secret-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan complete Git history for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
