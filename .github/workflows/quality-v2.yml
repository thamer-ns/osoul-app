name: Osoli quality v3

on:
  pull_request:
  push:
    branches:
      - main
      - agent/osoul-production-hardening-v2

concurrency:
  group: osoli-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Compile every Python file
        run: python -m compileall -q .

      - name: Project self-check
        run: python tools/self_check.py

      - name: Critical Ruff checks for the complete repository
        run: >-
          ruff check .
          --select E9,F63,F7,F82
          --exclude .git,.venv,venv,__pycache__,build,dist

      - name: Repository line-by-line audit
        id: repository_audit
        continue-on-error: true
        run: python tools/repository_audit.py

      - name: Upload repository audit manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit
          path: repository-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Stop on critical repository audit finding
        if: steps.repository_audit.outcome == 'failure'
        run: |
          cat repository-audit.json
          exit 1

      - name: Bandit high-severity security scan
        run: >-
          bandit -r . -q -lll -iii
          -x ./tests,./.git,./.venv,./venv,./build,./dist

      - name: Python dependency vulnerability audit
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: XIRR tests
        run: pytest -q --tb=short tests/test_analytics_hardening.py

      - name: Advanced technical tests
        run: pytest -q --tb=short tests/test_advanced_v2.py

      - name: Tenant isolation tests
        env:
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: pytest -q --tb=short tests/test_tenant_scope_sql.py

      - name: Portfolio accounting and backup tests
        env:
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: pytest -q --tb=short tests/test_portfolio_metrics_v2.py

      - name: Import smoke test
        env:
          OSOUL_ALLOW_EPHEMERAL_AUTH_SECRET: "1"
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: |
          python - <<'PY'
          import app
          import security
          import tenant_scope
          import analytics_hardening
          import portfolio_metrics_v2
          import market_data_hardening
          import technical_indicators.advanced_v2
          import views.navbar
          import views.portfolio
          import views.dashboard
          import views.cash
          import views.sukuk
          import views.settings
          import views.signals
          import views.analysis
          print("imports-ok")
          PY

      - name: Complete test suite
        env:
          OSOUL_ALLOW_EPHEMERAL_AUTH_SECRET: "1"
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: pytest -q --tb=short

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
