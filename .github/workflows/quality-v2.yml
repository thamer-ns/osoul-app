name: Osoli quality v2

on:
  pull_request:
  push:
    branches:
      - main
      - agent/osoul-production-hardening-v2

concurrency:
  group: osoli-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax and project self-check
        run: python tools/self_check.py

      - name: Critical Ruff checks
        run: >-
          ruff check
          --select E9,F63,F7,F82
          app.py security.py database_security_hardening.py
          database_write_hardening.py tenant_scope.py ai_tenant_hardening.py
          analytics_hardening.py portfolio_metrics_v2.py market_data_hardening.py
          backup_system.py technical_indicators ai_engine_core/packs.py
          financial_analysis/thesis.py views/__init__.py views/navbar.py
          views/dashboard.py views/portfolio.py views/cash.py views/sukuk.py
          views/settings.py views/signals.py views/analysis/__init__.py
          views/analysis/technical.py views/analysis/thesis.py tests

      - name: XIRR tests
        id: xirr
        continue-on-error: true
        run: >-
          pytest -q --tb=long --junitxml=xirr-results.xml
          tests/test_analytics_hardening.py

      - name: Upload XIRR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xirr-diagnostics
          path: xirr-results.xml
          if-no-files-found: error
          retention-days: 7

      - name: Stop on XIRR failure
        if: steps.xirr.outcome == 'failure'
        run: |
          cat xirr-results.xml
          exit 1

      - name: Advanced technical tests
        run: pytest -q --tb=short tests/test_advanced_v2.py

      - name: Tenant isolation tests
        env:
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: pytest -q --tb=short tests/test_tenant_scope_sql.py

      - name: Portfolio accounting and backup tests
        env:
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: pytest -q --tb=short tests/test_portfolio_metrics_v2.py

      - name: Import smoke test
        env:
          OSOUL_ALLOW_EPHEMERAL_AUTH_SECRET: "1"
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: |
          python - <<'PY'
          import app
          import security
          import tenant_scope
          import analytics_hardening
          import portfolio_metrics_v2
          import market_data_hardening
          import technical_indicators.advanced_v2
          import views.navbar
          import views.portfolio
          import views.dashboard
          import views.cash
          import views.sukuk
          import views.settings
          import views.signals
          import views.analysis
          print("imports-ok")
          PY

      - name: Complete test suite
        env:
          OSOUL_ALLOW_EPHEMERAL_AUTH_SECRET: "1"
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: pytest -q --tb=short

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
