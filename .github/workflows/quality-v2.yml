name: Osoli quality v3

on:
  pull_request:
  push:
    branches:
      - main
      - agent/osoul-production-hardening-v2

concurrency:
  group: osoli-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/agent/osoul-production-hardening-v2' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/osoul-production-hardening-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply deterministic repository fixes
        run: python scripts/apply_repository_audit_fixes.py

      - name: Commit audited fixes
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No audited fixes were required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classical_analysis.py market_data.py osoli_logging.py requirements.txt \
            views/analysis/financial.py views/lab.py views/shared.py \
            tools/repository_audit.py .github/workflows/quality-v2.yml
          git commit -m "Fix repository-wide audit findings"
          git push origin HEAD:agent/osoul-production-hardening-v2
          echo "changed=true" >> "$GITHUB_OUTPUT"

  quality:
    needs: autofix
    if: ${{ always() && (needs.autofix.result == 'skipped' || (needs.autofix.result == 'success' && needs.autofix.outputs.changed != 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create audited source snapshot
        run: git archive --format=zip HEAD -o audited-source.zip

      - name: Upload audited source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: audited-source
          path: audited-source.zip
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Compile every Python file
        run: python -m compileall -q .

      - name: Project self-check
        run: python tools/self_check.py

      - name: Critical Ruff checks for the complete repository
        id: ruff
        continue-on-error: true
        run: >-
          ruff check .
          --select E9,F63,F7,F82
          --exclude .git,.venv,venv,__pycache__,build,dist
          --output-format json
          --output-file ruff-results.json

      - name: Repository line-by-line audit
        id: repository_audit
        continue-on-error: true
        run: python tools/repository_audit.py

      - name: Bandit high-severity security scan
        id: bandit
        continue-on-error: true
        run: >-
          bandit -r . -q -lll -iii
          -x ./tests,./.git,./.venv,./venv,./build,./dist
          -f json -o bandit-results.json

      - name: Python dependency vulnerability audit
        id: dependency_audit
        continue-on-error: true
        run: >-
          pip-audit -r requirements.txt --progress-spinner off
          -f json -o pip-audit-results.json

      - name: Upload static audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-static-audit
          path: |
            ruff-results.json
            repository-audit.json
            bandit-results.json
            pip-audit-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop on static audit failure
        if: ${{ steps.ruff.outcome == 'failure' || steps.repository_audit.outcome == 'failure' || steps.bandit.outcome == 'failure' || steps.dependency_audit.outcome == 'failure' }}
        run: |
          echo "Static audit failed. Review complete-static-audit artifact."
          exit 1

      - name: XIRR tests
        run: pytest -q --tb=short tests/test_analytics_hardening.py

      - name: Advanced technical tests
        run: pytest -q --tb=short tests/test_advanced_v2.py

      - name: Tenant isolation tests
        env:
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: pytest -q --tb=short tests/test_tenant_scope_sql.py

      - name: Portfolio accounting and backup tests
        env:
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: pytest -q --tb=short tests/test_portfolio_metrics_v2.py

      - name: Import smoke test
        env:
          OSOUL_ALLOW_EPHEMERAL_AUTH_SECRET: "1"
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: |
          python - <<'PY'
          import app
          import security
          import tenant_scope
          import analytics_hardening
          import portfolio_metrics_v2
          import market_data_hardening
          import technical_indicators.advanced_v2
          import views.navbar
          import views.portfolio
          import views.dashboard
          import views.cash
          import views.sukuk
          import views.settings
          import views.signals
          import views.analysis
          print("imports-ok")
          PY

      - name: Complete test suite
        env:
          OSOUL_ALLOW_EPHEMERAL_AUTH_SECRET: "1"
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_test.db"
        run: pytest -q --tb=short

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
