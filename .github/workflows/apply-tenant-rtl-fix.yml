name: Apply tenant compatibility and RTL repair

on:
  push:
    branches:
      - agent/fix-tenant-init-rtl-design

permissions:
  contents: write

jobs:
  apply-repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tenant-init-rtl-design
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply legacy tenant repair
        run: python scripts/apply_tenant_legacy_fix.py

      - name: Validate syntax
        run: python -m compileall -q app.py tenant_scope.py ui_theme_v2.py tests/test_tenant_legacy_identity.py tests/test_ui_theme_v2.py

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tenant_scope.py tests/test_tenant_legacy_identity.py tests/test_ui_theme_v2.py
          git commit -m "Fix legacy tenant initialization and add RTL regressions"
          git push origin HEAD:agent/fix-tenant-init-rtl-design
