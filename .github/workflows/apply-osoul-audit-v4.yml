name: Apply Osoli audit V4

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/osoul-audit-v4-session-persistence'
    runs-on: ubuntu-latest
    env:
      OSOUL_ALLOW_EPHEMERAL_AUTH_SECRET: "1"
      OSOUL_REQUIRE_DB: "0"
      OSOUL_ALLOW_SQLITE_FALLBACK: "1"
      SQLITE_PATH: "/tmp/osoul_audit_v4.db"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/osoul-audit-v4-session-persistence
          fetch-depth: 0

      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          echo "2af63c87c04e60c391eebab88dc114525016afcf53ebafbaeacdb321fffec5f7  .audit-release/part-00" | sha256sum --check
          echo "0c450ccd93ba3191048ac547992e5fe61c60be59a159b79bdd8d6df1f8493ca9  .audit-release/part-01" | sha256sum --check
          echo "a155d4098c29776505c6d19756b727e3676b16fad7e555c14b0b8eeab1066c12  .audit-release/part-02" | sha256sum --check
          echo "30ffdcc7f2de0d71b51df742d7323d2c7247f38b71b28e7e4f6c0a36a9561145  .audit-release/part-03" | sha256sum --check
          echo "a9aa6a29a4c3b6f0410c85db5aa0184d49c8bb0c7b5abf053cac99fd476fbb21  .audit-release/part-04" | sha256sum --check
          echo "f397449b7ef0d23fe8f16ade9e3a8baffb617175d9c457457cba1c96bf9c0824  .audit-release/part-05" | sha256sum --check
          echo "2848e288f6f1e80ee8d4e4ac7b3c95414763719bab508183d96928b3fe3a0acf  .audit-release/part-06" | sha256sum --check
          cat \
            .audit-release/part-00 \
            .audit-release/part-01 \
            .audit-release/part-02 \
            .audit-release/part-03 \
            .audit-release/part-04 \
            .audit-release/part-05 \
            .audit-release/part-06 \
            > /tmp/osoul-final.patch.gz.b64
          echo "392aef28d9ade054a8b4eb229de77c54123c0b3baf077854395fb56c0020a4d8  /tmp/osoul-final.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/osoul-final.patch.gz.b64 | gzip --decompress > /tmp/osoul-final.patch
          echo "2c1992e878885192f8162e89fbf661dff2dda9140cb8cad3483c252e2ad56230  /tmp/osoul-final.patch" | sha256sum --check
          git apply --check /tmp/osoul-final.patch
          git apply --whitespace=error-all /tmp/osoul-final.patch
          rm -rf .audit-release
          rm -f .github/workflows/apply-osoul-audit-v4.yml
          rm -rf .pytest_cache .ruff_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate complete application
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          python tools/self_check.py
          ruff check . --select E9,F63,F7,F82
          pytest -q --tb=short
          git diff --check

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "osoul-audit-bot"
          git config user.email "osoul-audit-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Audit V4: harden analytics and persist login across refresh"
          git push origin HEAD:agent/osoul-audit-v4-session-persistence
