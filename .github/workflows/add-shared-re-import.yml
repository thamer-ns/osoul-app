name: Add shared regex import

on:
  pull_request:

permissions:
  contents: write

jobs:
  add-import:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/osoul-production-hardening-v2
          fetch-depth: 0

      - name: Add missing import
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("views/shared.py")
          text = path.read_text(encoding="utf-8")
          if "import re\n" not in text:
              marker = "import html\n"
              if marker not in text:
                  raise SystemExit("import marker not found")
              text = text.replace(marker, marker + "import re\n", 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit import fix
        run: |
          if git diff --quiet; then
            echo "No import fix required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views/shared.py
          git commit -m "Fix shared report regex import"
          git push origin HEAD:agent/osoul-production-hardening-v2
