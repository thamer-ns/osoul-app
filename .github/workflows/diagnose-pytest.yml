name: Diagnose complete pytest failure

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose-tests:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-ui-performance-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture complete test failure
        env:
          OSOUL_ALLOW_EPHEMERAL_AUTH_SECRET: "1"
          OSOUL_REQUIRE_DB: "0"
          OSOUL_ALLOW_SQLITE_FALLBACK: "1"
          SQLITE_PATH: "/tmp/osoul_diagnostic.db"
        run: |
          set +e
          pytest -q --tb=short > PYTEST_DIAGNOSTICS.txt 2>&1
          code=$?
          echo >> PYTEST_DIAGNOSTICS.txt
          echo "PYTEST_EXIT_CODE=$code" >> PYTEST_DIAGNOSTICS.txt
          exit 0

      - name: Commit test diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PYTEST_DIAGNOSTICS.txt
          git commit -m "Record complete pytest diagnostics"
          git push origin HEAD:agent/full-ui-performance-audit
