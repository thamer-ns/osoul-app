name: Apply exhaustive audit V4 patch

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-audit-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/exhaustive-folder-file-line-audit-v4'
    runs-on: ubuntu-latest
    env:
      OSOUL_ALLOW_EPHEMERAL_AUTH_SECRET: "1"
      OSOUL_REQUIRE_DB: "0"
      OSOUL_ALLOW_SQLITE_FALLBACK: "1"
      SQLITE_PATH: "/tmp/osoul_audit_v4.db"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false

      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test -d .audit-v4
          cat .audit-v4/part-* > /tmp/audit-v4.patch.gz.b64
          echo "6ca2830787d43406d23162e1aec314d0a3cf92b115f8fa29dd6425944ec4803c  /tmp/audit-v4.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/audit-v4.patch.gz.b64 | gzip --decompress > /tmp/audit-v4.patch
          echo "0050f1b119e8ce32cda484c71459cb1e8d42a0faf7a60977a296186c572cdcf3  /tmp/audit-v4.patch" | sha256sum --check
          git apply --check /tmp/audit-v4.patch
          git apply /tmp/audit-v4.patch
          rm -rf .audit-v4
          rm -rf .pytest_cache .ruff_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q .
          python tools/self_check.py
          pytest -q --tb=short

      - name: Commit validated audit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "osoul-audit-bot"
          git config user.email "osoul-audit-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Audit V4: enforce closed candles and harden data contracts"
          git push origin HEAD:${GITHUB_HEAD_REF}
