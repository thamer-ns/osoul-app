name: Apply repository audit fixes

on:
  push:
    branches:
      - agent/osoul-production-hardening-v2

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/osoul-production-hardening-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply deterministic audit fixes
        run: python scripts/apply_repository_audit_fixes.py

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No fixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classical_analysis.py market_data.py osoli_logging.py requirements.txt \
            views/analysis/financial.py views/lab.py views/shared.py \
            tools/repository_audit.py .github/workflows/quality-v2.yml
          git commit -m "Fix repository-wide audit findings"
          git push origin HEAD:agent/osoul-production-hardening-v2
