[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["legacy", ".venv", "venv"]

[tool.ruff.lint]
# Merge-blocking correctness errors only. Broader style cleanup is staged
# separately so legacy formatting does not hide runtime defects.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
